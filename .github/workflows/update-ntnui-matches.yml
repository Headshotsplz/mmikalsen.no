name: Oppdater kampstatistikk

# Henter nye NTNUI 2-kamper fra NVBF hver natt og lagrer dem i
# public/data/ntnui-matches.json. Vercel publiserer automatisk ved endring.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hent nye kamper
        run: node scripts/update-ntnui-matches.mjs

      - name: Lagre endringer
        run: |
          if git diff --quiet -- public/data/ntnui-matches.json; then
            echo "Ingen nye kamper."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ntnui-matches.json
          git commit -m "Oppdater kampstatistikk fra NVBF"
          git push
